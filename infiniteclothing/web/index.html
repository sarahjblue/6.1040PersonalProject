<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infinite Clothing</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.ts"></script>
  </head>
  <body>
    <section id="auth-panel" class="panel auth-panel" aria-labelledby="auth-title">
      <h1 id="auth-title">Infinite Clothing</h1>
      <p id="auth-status" class="status" aria-live="polite">
        Sign in with your MIT account.
      </p>

      <form id="login-form" class="auth-form">
        <h2>Sign in</h2>
        <label>
          Username
          <input name="username" type="text" autocomplete="username" required />
        </label>
        <label>
          Password
          <input
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <button type="submit">Sign in</button>
      </form>

      <details class="auth-details">
        <summary>Create an account</summary>
        <form id="register-form" class="auth-form">
          <label>
            Username
            <input name="username" type="text" autocomplete="username" required />
          </label>
          <label>
            MIT email
            <input
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@mit.edu"
              required
            />
          </label>
          <label>
            Password
            <input
              name="password"
              type="password"
              autocomplete="new-password"
              required
            />
          </label>
          <button type="submit">Register</button>
        </form>
      </details>

    </section>

    <div id="authenticated-app" hidden>
      <header class="account-bar">
        <span>Signed in as <strong id="signed-in-user"></strong></span>
        <button id="logout-button" type="button">Sign out</button>
      </header>
      <main class="page">
        <section class="panel inventory-page">
          <h1>Infinite Clothing Marketplace</h1>
          <label>
            Your username
            <input id="current-user" type="text" readonly required />
          </label>
          <fieldset class="tag-filters">
            <legend>Filter by tags</legend>
            <label>
              Size
              <select id="filter-size-tag"></select>
            </label>
            <label>
              Color
              <select id="filter-color-tag"></select>
            </label>
            <button id="apply-tag-filter" type="button">Apply filters</button>
            <button id="clear-tag-filter" type="button">Clear filters</button>
          </fieldset>
          <div id="inventory" class="inventory"></div>
        </section>
      </main>

      <button
        id="add-item-launcher"
        class="add-item-launcher"
        type="button"
        aria-expanded="false"
        aria-controls="add-item-panel"
        aria-label="Add an item to inventory"
      >+</button>
      <button
        id="my-items-launcher"
        class="my-items-launcher"
        type="button"
        aria-expanded="false"
        aria-controls="my-items-panel"
        aria-label="Open your items menu"
      >My items</button>
      <section
        id="my-items-panel"
        class="my-items-panel panel"
        aria-labelledby="my-items-title"
        hidden
      >
        <header class="my-items-header">
          <h2 id="my-items-title">My items</h2>
          <button
            id="close-my-items"
            class="add-item-close"
            type="button"
            aria-label="Close my items menu"
          >×</button>
        </header>
        <div class="my-items-sections">
          <section aria-labelledby="posted-items-title">
            <h3 id="posted-items-title">Items you’ve posted</h3>
            <div id="posted-items-list" class="my-items-list"></div>
          </section>
          <section aria-labelledby="claimed-items-title">
            <h3 id="claimed-items-title">Items you’ve claimed</h3>
            <div id="claimed-items-list" class="my-items-list"></div>
          </section>
        </div>
      </section>
      <section
        id="add-item-panel"
        class="add-item-panel panel"
        aria-labelledby="add-item-title"
        hidden
      >
        <header class="add-item-header">
          <h2 id="add-item-title">Add an item</h2>
          <button
            id="close-add-item"
            class="add-item-close"
            type="button"
            aria-label="Close add item form"
          >×</button>
        </header>
        <form id="item-form" class="item-form">
          <label>
            Seller
            <input name="seller" type="text" readonly required />
          </label>
          <label>
            Item name
            <input name="name" type="text" placeholder="Give the item a name" required />
          </label>
          <label>
            Description
            <textarea name="description" rows="3" placeholder="Describe the item"></textarea>
          </label>
          <label>
            Price
            <input name="price" type="text" placeholder="$5" required />
          </label>
          <label>
            Item image (JPEG or PNG, up to 5 MB)
            <input
              name="image"
              type="file"
              accept=".jpg,.jpeg,.png,image/jpeg,image/png"
              required
            />
          </label>
          <fieldset class="tag-fields">
            <legend>Tags</legend>
            <label>
              Size
              <select id="size-tag" name="sizeTag"></select>
            </label>
            <label>
              Color
              <select id="color-tag" name="colorTag"></select>
            </label>
          </fieldset>
          <button type="submit">POST</button>
        </form>
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <button
        id="messages-launcher"
        class="messages-launcher"
        type="button"
        aria-expanded="false"
        aria-controls="messages-panel"
      >
        Messages
        <span
          id="unread-message-badge"
          class="unread-badge launcher-unread-badge"
          aria-hidden="true"
          hidden
        ></span>
      </button>
      <section
        id="messages-panel"
        class="messaging-panel"
        aria-label="Messages"
        hidden
      >
      <header class="messaging-header">
        <h2>Messages</h2>
        <div class="messaging-actions">
          <button id="refresh-messages" type="button">Refresh</button>
          <button id="close-messages" class="messages-close" type="button" aria-label="Close messages">
            ×
          </button>
        </div>
      </header>
      <details class="start-conversation">
        <summary>Start a new conversation</summary>
        <form id="start-conversation-form" class="message-compose">
            <label>
              Message seller
              <input
                id="message-recipient"
                type="text"
                placeholder="seller username"
                required
              />
            </label>
            <label>
              Item ID
              <input id="message-topic" type="text" placeholder="Select from an item" required />
            </label>
            <label>
              First message
              <textarea id="initial-message" rows="2" required></textarea>
            </label>
            <button type="submit">Start conversation</button>
        </form>
      </details>
      <div class="message-layout">
        <div>
          <h3>Your conversations</h3>
          <div id="conversation-list" class="conversation-list"></div>
        </div>
        <div class="message-thread">
          <h3 id="thread-title">Select a conversation</h3>
          <div id="message-list" class="message-list" aria-live="polite"></div>
          <form id="send-message-form" class="message-compose">
                <label>
                  Reply
                  <textarea
                    id="reply-content"
                    rows="2"
                    placeholder="Select a conversation to reply"
                    disabled
                    required
                  ></textarea>
                </label>
                <button id="send-message-button" type="submit" disabled>
                  Send reply
                </button>
          </form>
        </div>
      </div>
      </section>
    </div>
  </body>
</html>
